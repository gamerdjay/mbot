<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détecteur Réseau & Opérateur</title>
    <style>
        body {
            background-color: #000000;
            color: #00FF00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: left;
            border: 1px solid #00FF00;
            padding: 25px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            max-width: 550px;
            width: 100%;
        }

        h1 {
            text-align: center;
            font-size: 1.2em;
            margin-top: 0;
            border-bottom: 1px solid #00FF00;
            padding-bottom: 10px;
        }

        button {
            background-color: #000000;
            color: #00FF00;
            border: 2px solid #00FF00;
            padding: 12px 24px;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #00FF00;
            color: #000000;
            box-shadow: 0 0 10px #00FF00;
        }

        .section-title {
            color: #00FFFF;
            margin-top: 20px;
            margin-bottom: 5px;
            font-weight: bold;
            text-decoration: underline;
        }

        #resultats p {
            margin: 6px 0;
            font-size: 0.85em;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>[ DETECTEUR RESEAU & OPERATEUR ]</h1>
        <button id="btnFetch" onclick="getNetworkData()">ACTUALISER</button>

        <div id="resultats"></div>
    </div>

    <script>
        async function getNetworkData() {
            const btn = document.getElementById('btnFetch');
            const res = document.getElementById('resultats');
            
            btn.innerText = "Analyse en cours...";
            btn.disabled = true;

            // 1. Network Information API (Non supporté par Safari / iOS)
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            
            let networkType = "Non supporté sur cet appareil (iOS)";
            let rtt = "Non disponible";
            let downlink = "Non disponible";

            if (conn) {
                networkType = conn.effectiveType ? conn.effectiveType.toUpperCase() : "Inconnu";
                rtt = conn.rtt ? conn.rtt + " ms" : "Inconnu";
                downlink = conn.downlink ? conn.downlink + " Mb/s" : "Inconnu";
            }

            // 2. Requête HTTPS vers API d'IP compatible GitHub Pages
            let ip = "Inconnue";
            let isp = "Recherche...";
            let city = "Recherche...";
            let country = "Recherche...";

            try {
                const response = await fetch('https://ipapi.co/json/');
                if (response.ok) {
                    const data = await response.json();
                    ip = data.ip || "Inconnue";
                    isp = data.org || data.asn || "Non détecté";
                    city = data.city || "Non détectée";
                    country = data.country_name || "Non détecté";
                } else {
                    throw new Error("Erreur serveur API");
                }
            } catch (e) {
                isp = "Erreur de connexion (Bloqueur de pub ou limite)";
            }

            // 3. Injection du HTML
            res.innerHTML = `
                <div class="section-title">> QUALITE ET TYPE DE RESEAU</div>
                <p><strong>Type de réseau estimé :</strong> ${networkType}</p>
                <p><strong>Latence estimée (RTT) :</strong> ${rtt}</p>
                <p><strong>Vitesse estimée (Downlink) :</strong> ${downlink}</p>

                <div class="section-title">> OPERATEUR ET IDENTIFICATION</div>
                <p><strong>Adresse IP :</strong> ${ip}</p>
                <p><strong>Opérateur / FAI :</strong> ${isp}</p>
                <p><strong>Ville :</strong> ${city}</p>
                <p><strong>Pays :</strong> ${country}</p>
            `;

            btn.innerText = "ACTUALISER";
            btn.disabled = false;
        }

        // Lancement automatique de l'analyse au chargement de la page
        window.onload = getNetworkData;
    </script>

</body>
</html>
