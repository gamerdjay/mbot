<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyse Réseau & Opérateur</title>
    <style>
        body {
            background-color: #000000;
            color: #00FF00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: left;
            border: 1px solid #00FF00;
            padding: 25px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            max-width: 550px;
            width: 100%;
        }

        h1 {
            text-align: center;
            font-size: 1.3em;
            margin-top: 0;
            border-bottom: 1px solid #00FF00;
            padding-bottom: 10px;
        }

        button {
            background-color: #000000;
            color: #00FF00;
            border: 2px solid #00FF00;
            padding: 12px 24px;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #00FF00;
            color: #000000;
            box-shadow: 0 0 10px #00FF00;
        }

        .section-title {
            color: #00FFFF;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            text-decoration: underline;
        }

        #resultats p {
            margin: 6px 0;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>[ DETECTEUR RESEAU & OPERATEUR ]</h1>
        <button id="btnFetch" onclick="getNetworkData()">ANALYSER LA CONNEXION</button>

        <div id="resultats"></div>
    </div>

    <script>
        async function getNetworkData() {
            const btn = document.getElementById('btnFetch');
            const res = document.getElementById('resultats');
            
            btn.innerText = "Analyse...";
            btn.disabled = true;

            // 1. Récupération des données Network Information API (Navigateur)
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            
            let networkType = "Non disponible";
            let rtt = "Non disponible";
            let downlink = "Non disponible";

            if (conn) {
                networkType = conn.effectiveType ? conn.effectiveType.toUpperCase() : "Inconnu";
                rtt = conn.rtt ? conn.rtt + " ms" : "Inconnu";
                downlink = conn.downlink ? conn.downlink + " Mb/s" : "Inconnu";
            }

            // 2. Récupération de l'Opérateur via l'adresse IP
            let isp = "Recherche...";
            let org = "Recherche...";
            let ip = "Inconnue";

            try {
                const response = await fetch('http://ip-api.com/json/');
                if (response.ok) {
                    const data = await response.json();
                    isp = data.isp || "Non détecté";
                    org = data.org || "Non détecté";
                    ip = data.query || "Inconnue";
                }
            } catch (e) {
                isp = "Erreur de connexion à l'API";
            }

            // 3. Affichage
            res.innerHTML = `
                <div class="section-title">> QUALITE ET TYPE DE RESEAU</div>
                <p><strong>Type de réseau estimé :</strong> ${networkType}</p>
                <p><strong>Latence estimée (RTT) :</strong> ${rtt}</p>
                <p><strong>Vitesse estimée (Downlink) :</strong> ${downlink}</p>

                <div class="section-title">> OPERATEUR ET IDENTIFICATION</div>
                <p><strong>Adresse IP :</strong> ${ip}</p>
                <p><strong>Opérateur (FAI / ISP) :</strong> ${isp}</p>
                <p><strong>Organisation réseau :</strong> ${org}</p>
            `;

            btn.innerText = "ACTUALISER";
            btn.disabled = false;
        }
    </script>

</body>
</html>
